name: Visual QA

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'qa-output/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.54.2
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(which google-chrome || which google-chrome-stable || which chromium-browser || which chromium)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/tasmeer-http.log 2>&1 &
          sleep 2
      - name: Run responsive QA
        id: qa
        continue-on-error: true
        run: node scripts/visual-qa.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa-artifacts/
          retention-days: 3
      - name: Publish QA report
        if: always()
        run: |
          mkdir -p qa-output
          if [ -f qa-artifacts/report.json ]; then
            cp qa-artifacts/report.json qa-output/report.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qa-output/report.json
            git diff --cached --quiet || git commit -m "Store visual QA report [skip ci]"
            git push
          fi
      - name: Fail if QA failed
        if: steps.qa.outcome == 'failure'
        run: exit 1
